services:
  - type: web_service
    name: covid-vaccine-tracker-api
    env: python
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    servicePath: app
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
